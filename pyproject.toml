# Deployment configuration only. The project is run from requirements.txt and
# main.py / app.py; nothing here changes how it works locally.
#
# Vercel resolves the FastAPI entrypoint by scanning for app.py, index.py,
# server.py, main.py, wsgi.py or asgi.py at the project root. Both names it
# would find here are already taken by something that is not an ASGI app:
# app.py is the Streamlit interface and main.py is the CLI. Naming the module
# explicitly is what stops it guessing wrong.
#
# There is deliberately no [project] table: dependencies stay in
# requirements.txt as the single source, which is also what the runtime installs.
[tool.vercel]
entrypoint = "api.index:app"
